spring.application.name=books-app

# --- PostgreSQL connection (change the password to yours) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/books_db
spring.datasource.username=postgres
spring.datasource.password=your_password

# --- JPA / Hibernate ---
# "update" creates the "books" table automatically on first run and keeps it in sync
spring.jpa.hibernate.ddl-auto=update
# Print the SQL generated by Hibernate in the console (useful to explain in class)
spring.jpa.show-sql=true

# Hides a harmless warning about open-in-view
spring.jpa.open-in-view=false

# The backend AND the frontend run on this port: http://localhost:8080
server.port=8080
