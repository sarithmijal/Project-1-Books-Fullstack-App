# API Gateway (reverse proxy): the ONLY entry point of the system (port 80).
# The users never see ports 8080 / 8081; Nginx forwards each request inside the Docker network.

server {
    listen 80;
    server_name _;

    # /pokedex  ->  /pokedex/  (so the relative css/ and js/ paths of the page work)
    location = /pokedex {
        return 301 /pokedex/;
    }

    # Page 2 (Pokedex): /pokedex/...  ->  container "pokemon" on port 8081 (prefix removed)
    location /pokedex/ {
        proxy_pass http://pokemon:8081/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page 1 (books) and its REST API (/api/books)  ->  container "books" on port 8080
    location / {
        proxy_pass http://books:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}