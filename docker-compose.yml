# Starts the 4 pieces:
#   gateway (Nginx, port 80)  ->  books (Spring Boot)  ->  db (PostgreSQL)
#                             ->  pokemon (Spring Boot)
# Only the gateway is reachable from the internet. The apps have NO public ports.
# The database port (5432) is open only between our own servers (Security Group).
# Run it from this folder:  docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: books_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data   # keeps your books when the container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d books_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  books:
    build: .
    image: ${DOCKERHUB_USER}/books-app:latest      # name used to push it to Docker Hub
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These override application.properties, so no password is written in the code
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-db}:5432/books_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    # no "ports": only the gateway can reach this container

  pokemon:
    build: ../pokemon-app
    image: ${DOCKERHUB_USER}/pokemon-app:latest    # name used to push it to Docker Hub
    restart: unless-stopped
    # no "ports": only the gateway can reach this container

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - books
      - pokemon
    ports:
      - "80:80"                                    # the ONLY public port
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: